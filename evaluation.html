<!DOCTYPE html>
<html>

<head>

    <title>Evaluation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="wrapper">

    <div class="sidebar">

        <h2 class="logo">AI Frontline</h2>

        <ul>

            <li onclick="window.location.href='/'">
                Dashboard
            </li>

            <li onclick="window.location.href='/results'">
                Results
            </li>

            <li class="active">
                Evaluation
            </li>

        </ul>

    </div>

    <div class="main">

        <h1>Analytics & Evaluation</h1>

        <br>

        <div class="stats">

            <div class="card-box">
                <h6>AI Accuracy</h6>
                <h2>{{ accuracy }}%</h2>
            </div>

            <div class="card-box">
                <h6>Precision</h6>
                <h2>89.7%</h2>
            </div>

            <div class="card-box">
                <h6>Recall</h6>
                <h2>91.4%</h2>
            </div>

            <div class="card-box">
                <h6>Escalations</h6>
                <h2>3</h2>
            </div>

        </div>

        <div class="row mt-4">

            <div class="col-md-8">

                <div class="card p-4">

                    <h4>Escalation Trend</h4>

                    <canvas id="lineChart"></canvas>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card p-4">

                    <h4>Category Distribution</h4>

                    <canvas id="pieChart"></canvas>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

new Chart(
document.getElementById("lineChart"),
{
type:"line",
data:{
labels:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
datasets:[{
label:"Escalations",
data:[10,15,12,25,20,30,22]
}]
}
});

new Chart(
document.getElementById("pieChart"),
{
type:"doughnut",
data:{
labels:[
"Billing",
"Technical",
"Account",
"Other"
],
datasets:[{
data:[45,30,15,10]
}]
}
});

</script>

</body>
</html>
